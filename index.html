<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지수함수와 로그함수 대칭성 시각화</title>
    <!-- 시각화를 위한 Plotly 라이브러리 로드 -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .control-panel {
            margin: 20px 0;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
        }
        input[type=range] {
            width: 60%;
            cursor: pointer;
        }
        h1 { color: #343a40; font-size: 1.5rem; }
        .math-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>지수함수와 로그함수 역함수 관계 ($y=x$ 대칭)</h1>
        
        <div class="control-panel">
            <label for="baseSlider"><strong>밑 (Base) <span class="math-text">a</span> : </strong></label>
            <span id="baseValue" class="math-text" style="font-size: 1.2rem; color: #d63384;">2.0</span><br><br>
            <input type="range" id="baseSlider" min="0.1" max="5.0" step="0.1" value="2.0">
            <p style="font-size: 0.9rem; color: #6c757d;">(슬라이더를 움직여 밑 $a$의 값을 변경해 보세요. $a=1$인 경우는 정의되지 않아 제외됩니다.)</p>
        </div>

        <div id="graphPlot"></div>
    </div>

    <script>
        // 초기 그래프 렌더링
        drawGraph();

        // 슬라이더 이벤트 리스너 설정
        document.getElementById('baseSlider').addEventListener('input', function() {
            let a = parseFloat(this.value);
            // 밑이 1이 되는 경우, 로그함수 분모가 0이 되는 것을 방지
            if (a === 1.0) {
                a = 1.1; 
                this.value = 1.1;
            }
            document.getElementById('baseValue').innerText = a.toFixed(1);
            drawGraph(a);
        });

        function drawGraph(a = 2.0) {
            const xValuesExp = [];
            const yValuesExp = [];
            const xValuesLog = [];
            const yValuesLog = [];
            const xValuesLine = [];
            const yValuesLine = [];

            // 1. 지수함수 데이터 및 y=x 데이터 생성 (-5 <= x <= 5)
            for (let x = -5; x <= 5; x += 0.05) {
                xValuesExp.push(x);
                yValuesExp.push(Math.pow(a, x)); // f(x) = a^x

                xValuesLine.push(x);
                yValuesLine.push(x); // f(x) = x
            }

            // 2. 로그함수 데이터 생성 (x > 0, 정의역 제한)
            for (let x = 0.001; x <= 5; x += 0.05) {
                xValuesLog.push(x);
                yValuesLog.push(Math.log(x) / Math.log(a)); // 밑변환 공식: log_a(x) = ln(x) / ln(a)
            }

            // 지수함수 트레이스
            const traceExp = {
                x: xValuesExp,
                y: yValuesExp,
                mode: 'lines',
                name: `y = ${a.toFixed(1)}<sup>x</sup>`,
                line: { color: '#0d6efd', width: 3 }
            };

            // 로그함수 트레이스
            const traceLog = {
                x: xValuesLog,
                y: yValuesLog,
                mode: 'lines',
                name: `y = log<sub>${a.toFixed(1)}</sub>(x)`,
                line: { color: '#dc3545', width: 3 }
            };

            // 항등함수 (y = x) 트레이스
            const traceIdentity = {
                x: xValuesLine,
                y: yValuesLine,
                mode: 'lines',
                name: 'y = x (대칭축)',
                line: { color: '#6c757d', width: 2, dash: 'dash' }
            };

            const data = [traceExp, traceLog, traceIdentity];

            const layout = {
                xaxis: { 
                    range: [-5, 5], 
                    zeroline: true, 
                    zerolinecolor: 'black',
                    title: 'x 축'
                },
                yaxis: { 
                    range: [-5, 5], 
                    zeroline: true, 
                    zerolinecolor: 'black',
                    title: 'y 축',
                    scaleanchor: "x", // x, y축 비율을 1:1로 고정하여 기하학적 대칭을 정확히 표현
                    scaleratio: 1 
                },
                width: 700,
                height: 700,
                margin: { l: 50, r: 50, t: 50, b: 50 },
                legend: { x: 0.05, y: 0.95 }
            };

            // Plotly를 이용해 지정된 div에 그래프 렌더링
            Plotly.newPlot('graphPlot', data, layout, {responsive: true});
        }
    </script>
</body>
</html>
