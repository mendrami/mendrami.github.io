<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poem</title>
    <style>
        body {
            font-family: 'Noto Serif KR', 'Malgun Gothic', serif;
            background-color: #2c3e50; 
            color: #ecf0f1; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .poem-content {
            font-size: 20px;
            line-height: 2.2;
            text-align: left;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="poem-content">
        치욕이여,<br>
        모락모락 김 나는<br>
        한 그릇 쌀밥이여,<br>
        꿈꾸는 일이 목 조르는 일 같아<br>
        우리 떠난 후에 더욱 빛날 철길이여!
    </div>
</body>
</html>
