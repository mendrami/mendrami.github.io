<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지수함수와 로그함수 대칭성 시각화 (Zoom & Pan)</title>
    <!-- 시각화를 위한 Plotly 라이브러리 로드 -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .control-panel {
            margin: 15px 0;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .pan-grid {
            display: grid;
            grid-template-columns: 40px 40px 40px;
            grid-template-rows: 40px 40px 40px;
            gap: 5px;
            margin-left: 20px;
        }
        .pan-btn {
            padding: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #0d6efd;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0b5ed7; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5c636a; }
        input[type=range] { width: 300px; cursor: pointer; }
        h1 { color: #343a40; font-size: 1.5rem; margin-bottom: 5px; }
        .math-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>지수함수와 로그함수 역함수 관계 ($y=x$ 대칭)</h1>
        
        <div class="control-panel">
            <div>
                <label for="baseSlider"><strong>밑 (Base) <span class="math-text">a</span> : </strong></label>
                <span id="baseValue" class="math-text" style="font-size: 1.2rem; color: #d63384;">2.0</span><br>
                <input type="range" id="baseSlider" min="0.1" max="5.0" step="0.1" value="2.0">
            </div>
            
            <div class="button-group">
                <div>
                    <strong>확대/축소: </strong>
                    <button onclick="zoom(0.5)">+ 줌 인</button>
                    <button onclick="zoom(2.0)">- 줌 아웃</button>
                    <button class="btn-secondary" onclick="resetView()">초기화</button>
                </div>

                <div class="pan-grid">
                    <div></div>
                    <button class="pan-btn" onclick="pan(0, 1)">▲</button>
                    <div></div>
                    <button class="pan-btn" onclick="pan(-1, 0)">◀</button>
                    <button class="pan-btn btn-secondary" onclick="resetView()">●</button>
                    <button class="pan-btn" onclick="pan(1, 0)">▶</button>
                    <div></div>
                    <button class="pan-btn" onclick="pan(0, -1)">▼</button>
                    <div></div>
                </div>
            </div>
            <p style="font-size: 0.85rem; color: #6c757d; margin: 0;">
                💡 <strong>팁:</strong> 그래프 영역을 직접 <strong>클릭 후 드래그</strong>하면 자유롭게 이동할 수 있으며, <strong>마우스 휠</strong>로 확대/축소가 가능합니다.
            </p>
        </div>

        <div id="graphPlot"></div>
    </div>

    <script>
        // X축, Y축 각각의 렌더링 범위 독립적 관리 (Pan 이동 시 독립적 변위 발생 대비)
        let currentRangeX = [-5, 5];
        let currentRangeY = [-5, 5];
        let currentBase = 2.0;

        drawGraph();

        document.getElementById('baseSlider').addEventListener('input', function() {
            let a = parseFloat(this.value);
            if (a === 1.0) { a = 1.1; this.value = 1.1; }
            currentBase = a;
            document.getElementById('baseValue').innerText = a.toFixed(1);
            updatePlotData();
        });

        // 줌 함수 (Viewport 스케일 변환)
        function zoom(factor) {
            const centerX = (currentRangeX[0] + currentRangeX[1]) / 2;
            const spanX = (currentRangeX[1] - currentRangeX[0]) / 2;
            currentRangeX[0] = centerX - (spanX * factor);
            currentRangeX[1] = centerX + (spanX * factor);

            const centerY = (currentRangeY[0] + currentRangeY[1]) / 2;
            const spanY = (currentRangeY[1] - currentRangeY[0]) / 2;
            currentRangeY[0] = centerY - (spanY * factor);
            currentRangeY[1] = centerY + (spanY * factor);
            
            updateLayout();
        }

        // 평행이동(Pan) 함수 (현재 스팬의 15%만큼 이동)
        function pan(dx, dy) {
            const spanX = currentRangeX[1] - currentRangeX[0];
            const spanY = currentRangeY[1] - currentRangeY[0];
            
            const moveX = spanX * dx * 0.15;
            const moveY = spanY * dy * 0.15;

            currentRangeX[0] += moveX;
            currentRangeX[1] += moveX;
            currentRangeY[0] += moveY;
            currentRangeY[1] += moveY;

            updateLayout();
        }

        // 뷰 초기화 함수
        function resetView() {
            currentRangeX = [-5, 5];
            currentRangeY = [-5, 5];
            updateLayout();
        }

        // Plotly 레이아웃 업데이트 (Range 갱신)
        function updateLayout() {
            const update = {
                'xaxis.range': currentRangeX,
                'yaxis.range': currentRangeY
            };
            Plotly.relayout('graphPlot', update);
        }

        // 데이터 생성 로직 (현재 시야각보다 넓은 영역 렌더링을 통해 이동 시 빈 공간 방지)
        function generateData(a, rangeX, rangeY) {
            const xValuesExp = [], yValuesExp = [];
            const xValuesLog = [], yValuesLog = [];
            const xValuesLine = [], yValuesLine = [];

            // 렌더링할 데이터 도메인을 현재 화면보다 3배 넓게 잡아 이동(Pan)에 대비
            const minX = rangeX[0] - (rangeX[1] - rangeX[0]);
            const maxX = rangeX[1] + (rangeX[1] - rangeX[0]);
            const step = (maxX - minX) / 1500; 

            for (let x = minX; x <= maxX; x += step) {
                xValuesExp.push(x);
                yValuesExp.push(Math.pow(a, x));
                
                xValuesLine.push(x);
                yValuesLine.push(x);

                if (x > 0) {
                    xValuesLog.push(x);
                    yValuesLog.push(Math.log(x) / Math.log(a));
                }
            }

            return [
                { x: xValuesExp, y: yValuesExp },
                { x: xValuesLog, y: yValuesLog },
                { x: xValuesLine, y: yValuesLine }
            ];
        }

        function updatePlotData() {
            const dataSets = generateData(currentBase, currentRangeX, currentRangeY);
            const update = {
                x: [dataSets[0].x, dataSets[1].x, dataSets[2].x],
                y: [dataSets[0].y, dataSets[1].y, dataSets[2].y],
                name: [
                    `y = ${currentBase.toFixed(1)}<sup>x</sup>`,
                    `y = log<sub>${currentBase.toFixed(1)}</sub>(x)`,
                    'y = x (대칭축)'
                ]
            };
            Plotly.restyle('graphPlot', update);
        }

        function drawGraph() {
            const dataSets = generateData(currentBase, currentRangeX, currentRangeY);

            const traceExp = {
                x: dataSets[0].x, y: dataSets[0].y,
                mode: 'lines', name: `y = ${currentBase.toFixed(1)}<sup>x</sup>`,
                line: { color: '#0d6efd', width: 3 }
            };

            const traceLog = {
                x: dataSets[1].x, y: dataSets[1].y,
                mode: 'lines', name: `y = log<sub>${currentBase.toFixed(1)}</sub>(x)`,
                line: { color: '#dc3545', width: 3 }
            };

            const traceIdentity = {
                x: dataSets[2].x, y: dataSets[2].y,
                mode: 'lines', name: 'y = x (대칭축)',
                line: { color: '#6c757d', width: 2, dash: 'dash' }
            };

            const layout = {
                dragmode: 'pan', // 기본 마우스 동작을 줌(Zoom)에서 평행이동(Pan)으로 변경
                xaxis: { 
                    range: currentRangeX, 
                    zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2,
                    title: 'x 축'
                },
                yaxis: { 
                    range: currentRangeY, 
                    zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2,
                    title: 'y 축',
                    scaleanchor: "x", scaleratio: 1 
                },
                width: 800, height: 600,
                margin: { l: 50, r: 50, t: 30, b: 50 },
                legend: { x: 0.05, y: 0.95 },
                hovermode: 'closest'
            };

            Plotly.newPlot('graphPlot', [traceExp, traceLog, traceIdentity], layout, {
                responsive: true,
                scrollZoom: true,
                displayModeBar: false // 사용자 정의 버튼을 제공하므로 기본 도구 모음 숨김
            });

            // 마우스 드래그(Pan) 및 휠(Zoom) 이벤트 발생 시 내부 상태 변수(Range) 동기화
            document.getElementById('graphPlot').on('plotly_relayout', function(eventData) {
                let layoutNeedsUpdate = false;
                if (eventData['xaxis.range[0]'] !== undefined) {
                    currentRangeX[0] = eventData['xaxis.range[0]'];
                    currentRangeX[1] = eventData['xaxis.range[1]'];
                    layoutNeedsUpdate = true;
                }
                if (eventData['yaxis.range[0]'] !== undefined) {
                    currentRangeY[0] = eventData['yaxis.range[0]'];
                    currentRangeY[1] = eventData['yaxis.range[1]'];
                    layoutNeedsUpdate = true;
                }
                
                // 마우스로 크게 이동했을 때 화면 밖에 선이 끊기는 현상을 방지하기 위해 데이터 재계산
                if (layoutNeedsUpdate) {
                    updatePlotData(); 
                }
            });
        }
    </script>
</body>
</html>
