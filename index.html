<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다중 수학 함수 동시 비교</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #343a40; text-align: center; font-size: 1.6rem; margin-bottom: 20px; }
        
        .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .panel { background: #e9ecef; padding: 15px; border-radius: 8px; border-top: 4px solid #6c757d; }
        .panel.poly { border-top-color: #0d6efd; } /* Blue */
        .panel.exp { border-top-color: #dc3545; }  /* Red */
        .panel.log { border-top-color: #198754; }  /* Green */
        
        .panel-header { display: flex; align-items: center; justify-content: space-between; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .switch-container { display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"].toggle { transform: scale(1.3); cursor: pointer; }
        
        .input-row { display: flex; align-items: center; margin-bottom: 8px; gap: 5px; font-size: 0.9rem; flex-wrap: wrap; }
        input[type="number"] { padding: 4px; width: 60px; border-radius: 4px; border: 1px solid #ced4da; text-align: right; }
        button.btn-small { padding: 4px 8px; cursor: pointer; border: none; border-radius: 4px; background-color: #343a40; color: white; }
        
        .poly-coeffs { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 5px; margin-top: 10px; }
        .poly-item { background: #fff; padding: 5px; border-radius: 4px; border: 1px solid #dee2e6; text-align: center; font-size: 0.85rem; }
        .poly-item input { width: 50px; }

        #math-display { text-align: center; font-size: 1.3rem; margin: 15px 0; min-height: 80px; padding: 15px; background: #fdfdfe; border-radius: 8px; border: 1px solid #e9ecef; }
    </style>
</head>
<body>

<div class="container">
    <h1>다항함수, 지수함수, 로그함수 점근적 증가율 비교 모델</h1>
    
    <div class="control-grid">
        <!-- N차 다항함수 패널 -->
        <div class="panel poly">
            <div class="panel-header">
                <span style="color: #0d6efd;">다항함수 P(x)</span>
                <div class="switch-container">
                    <input type="checkbox" id="polyActive" class="toggle" checked onchange="updatePlot()"> <label for="polyActive">활성화</label>
                </div>
            </div>
            <div class="input-row">
                <label>차수 (N) : </label>
                <input type="number" id="polyDegree" min="1" max="10" value="2" step="1">
                <button class="btn-small" onclick="generatePolyInputs()">계수 생성</button>
            </div>
            <div id="polyInputsContainer" class="poly-coeffs"></div>
        </div>

        <!-- 지수함수 패널 -->
        <div class="panel exp">
            <div class="panel-header">
                <span style="color: #dc3545;">지수함수 E(x)</span>
                <div class="switch-container">
                    <input type="checkbox" id="expActive" class="toggle" checked onchange="updatePlot()"> <label for="expActive">활성화</label>
                </div>
            </div>
            <div class="input-row"><label>계수 (C):</label><input type="number" id="expC" value="1" step="0.5" oninput="updatePlot()"></div>
            <div class="input-row"><label>밑 (a):</label><input type="number" id="expBase" value="2" min="0.1" step="0.1" oninput="updatePlot()"></div>
            <div class="input-row"><label>상수 (K):</label><input type="number" id="expK" value="0" step="1" oninput="updatePlot()"></div>
        </div>

        <!-- 로그함수 패널 -->
        <div class="panel log">
            <div class="panel-header">
                <span style="color: #198754;">로그함수 L(x)</span>
                <div class="switch-container">
                    <input type="checkbox" id="logActive" class="toggle" checked onchange="updatePlot()"> <label for="logActive">활성화</label>
                </div>
            </div>
            <div class="input-row"><label>계수 (C):</label><input type="number" id="logC" value="1" step="0.5" oninput="updatePlot()"></div>
            <div class="input-row"><label>밑 (a):</label><input type="number" id="logBase" value="2" min="0.1" step="0.1" oninput="updatePlot()"></div>
            <div class="input-row"><label>상수 (K):</label><input type="number" id="logK" value="0" step="1" oninput="updatePlot()"></div>
        </div>
    </div>

    <!-- 수학 공식 렌더링 영역 -->
    <div id="math-display"></div>

    <!-- 그래프 영역 -->
    <div id="graphPlot"></div>
</div>

<script>
    let polyCoeffs = [];

    // N차 다항함수 입력란 생성
    function generatePolyInputs() {
        let degree = parseInt(document.getElementById('polyDegree').value);
        if (isNaN(degree) || degree < 1) degree = 1;
        if (degree > 10) { degree = 10; document.getElementById('polyDegree').value = 10; }
        
        const container = document.getElementById('polyInputsContainer');
        container.innerHTML = '';
        polyCoeffs = new Array(degree + 1).fill(0);
        polyCoeffs[degree] = 1; // 기본값 y = x^n

        for (let i = degree; i >= 0; i--) {
            const div = document.createElement('div');
            div.className = 'poly-item';
            div.innerHTML = `
                <label>x<sup>${i}</sup></label><br>
                <input type="number" id="poly_c_${i}" value="${polyCoeffs[i]}" step="0.5" oninput="syncPolyCoeffs(${i})">
            `;
            container.appendChild(div);
        }
        updatePlot();
    }

    function syncPolyCoeffs(index) {
        polyCoeffs[index] = parseFloat(document.getElementById(`poly_c_${index}`).value) || 0;
        updatePlot();
    }

    // 활성화된 함수들에 대한 다중 LaTeX 문자열 생성기
    function generateLatexAll() {
        let latexLines = [];

        // 다항함수 P(x)
        if (document.getElementById('polyActive').checked) {
            let terms = [];
            for (let i = polyCoeffs.length - 1; i >= 0; i--) {
                let c = polyCoeffs[i];
                if (c === 0) continue;
                let term = '';
                if (c > 0 && terms.length > 0) term += '+ ';
                else if (c < 0) term += '- ';
                let absC = Math.abs(c);
                if (absC !== 1 || i === 0) term += absC;
                if (i > 0) {
                    term += 'x';
                    if (i > 1) term += '^' + i;
                }
                terms.push(term);
            }
            let polyStr = terms.length > 0 ? terms.join(' ') : '0';
            latexLines.push(`\\color{#0d6efd}{P(x) = ${polyStr}}`);
        }

        // 지수함수 E(x)
        if (document.getElementById('expActive').checked) {
            let c = parseFloat(document.getElementById('expC').value) || 1;
            let a = parseFloat(document.getElementById('expBase').value) || 2;
            let k = parseFloat(document.getElementById('expK').value) || 0;
            let expStr = `${c !== 1 ? c + ' \\cdot ' : ''}${a}^x`;
            if (k > 0) expStr += ` + ${k}`; else if (k < 0) expStr += ` - ${Math.abs(k)}`;
            latexLines.push(`\\color{#dc3545}{E(x) = ${expStr}}`);
        }

        // 로그함수 L(x)
        if (document.getElementById('logActive').checked) {
            let c = parseFloat(document.getElementById('logC').value) || 1;
            let a = parseFloat(document.getElementById('logBase').value) || 2;
            let k = parseFloat(document.getElementById('logK').value) || 0;
            let logStr = `${c !== 1 ? c + ' \\cdot ' : ''}\\log_{${a}}(x)`;
            if (k > 0) logStr += ` + ${k}`; else if (k < 0) logStr += ` - ${Math.abs(k)}`;
            latexLines.push(`\\color{#198754}{L(x) = ${logStr}}`);
        }

        if (latexLines.length === 0) return '$$\\text{선택된 함수가 없습니다.}$$';
        
        // 여러 줄로 렌더링
        return '$$\\begin{matrix} ' + latexLines.join(' \\\\ ') + ' \\end{matrix}$$';
    }

    // 렌더링 엔진: 선택된 함수들의 좌표 데이터 산출
    function calculateTraces(rangeX) {
        const traces = [];
        const spanX = rangeX[1] - rangeX[0];
        const minX = rangeX[0] - spanX;
        const maxX = rangeX[1] + spanX;
        const step = Math.max((maxX - minX) / 2000, 0.001);

        // 1. 다항함수 데이터 산출
        if (document.getElementById('polyActive').checked) {
            const xVal = [], yVal = [];
            for (let x = minX; x <= maxX; x += step) {
                xVal.push(x);
                let y = 0;
                for (let i = 0; i < polyCoeffs.length; i++) y += polyCoeffs[i] * Math.pow(x, i);
                yVal.push(y);
            }
            traces.push({ x: xVal, y: yVal, mode: 'lines', name: 'P(x) 다항함수', line: { color: '#0d6efd', width: 3 }});
        }

        // 2. 지수함수 데이터 산출
        if (document.getElementById('expActive').checked) {
            const xVal = [], yVal = [];
            let c = parseFloat(document.getElementById('expC').value) || 1;
            let a = Math.max(parseFloat(document.getElementById('expBase').value) || 2, 0.001);
            if (a === 1) a = 1.0001; // a=1 특이점 예외 처리
            let k = parseFloat(document.getElementById('expK').value) || 0;

            for (let x = minX; x <= maxX; x += step) {
                xVal.push(x);
                yVal.push(c * Math.pow(a, x) + k);
            }
            traces.push({ x: xVal, y: yVal, mode: 'lines', name: 'E(x) 지수함수', line: { color: '#dc3545', width: 3 }});
        }

        // 3. 로그함수 데이터 산출
        if (document.getElementById('logActive').checked) {
            const xVal = [], yVal = [];
            let c = parseFloat(document.getElementById('logC').value) || 1;
            let a = Math.max(parseFloat(document.getElementById('logBase').value) || 2, 0.001);
            if (a === 1) a = 1.0001;
            let k = parseFloat(document.getElementById('logK').value) || 0;
            
            const logMin = Math.max(0.00001, minX); // 로그함수 정의역 (x > 0)
            for (let x = logMin; x <= maxX; x += step) {
                xVal.push(x);
                yVal.push(c * (Math.log(x) / Math.log(a)) + k);
            }
            traces.push({ x: xVal, y: yVal, mode: 'lines', name: 'L(x) 로그함수', line: { color: '#198754', width: 3 }});
        }

        return traces;
    }

    function getDynamicTick(range) {
        if (!range || range.length < 2) return 0.5;
        const span = Math.abs(range[1] - range[0]);
        return span <= 20 ? 0.5 : undefined; // 최소 눈금 단위 0.5 유지
    }

    function updatePlot() {
        // 1. MathJax 수식 업데이트
        document.getElementById('math-display').innerHTML = generateLatexAll();
        MathJax.typesetPromise();

        const graphDiv = document.getElementById('graphPlot');
        if (!graphDiv.layout) return;

        const currentXRange = graphDiv.layout.xaxis.range;
        const currentYRange = graphDiv.layout.yaxis.range;
        
        // 2. 동적 데이터 산출
        const traces = calculateTraces(currentXRange);

        // 3. 레이아웃 갱신 (눈금 조절)
        const updateLayout = {
            'xaxis.dtick': getDynamicTick(currentXRange),
            'yaxis.dtick': getDynamicTick(currentYRange)
        };

        // Plotly.react를 사용하여 트레이스 개수 증감에 완벽 대응
        Plotly.react('graphPlot', traces, graphDiv.layout);
        Plotly.relayout('graphPlot', updateLayout);
    }

    function initGraph() {
        const layout = {
            dragmode: 'pan',
            xaxis: { range: [-5, 5], dtick: 0.5, zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2, gridcolor: '#e9ecef', title: 'x 축 (정의역)' },
            yaxis: { range: [-5, 5], dtick: 0.5, zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2, gridcolor: '#e9ecef', title: 'y 축 (치역)' },
            width: 1100, height: 700,
            margin: { l: 60, r: 40, t: 20, b: 60 },
            hovermode: 'closest',
            legend: { x: 0.02, y: 0.98, bgcolor: 'rgba(255, 255, 255, 0.8)', bordercolor: '#ced4da', borderwidth: 1 }
        };

        Plotly.newPlot('graphPlot', [], layout, {
            responsive: true, scrollZoom: true, displayModeBar: true, modeBarButtonsToRemove: ['lasso2d', 'select2d']
        });

        // 그래프 이동/확대 시 데이터 재연산
        document.getElementById('graphPlot').on('plotly_relayout', function() {
            updatePlot();
        });

        generatePolyInputs(); // 다항식 컨트롤 초기화 및 그래프 첫 렌더링
    }

    window.onload = initGraph;
</script>
</body>
</html>
