<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다중 수학 함수 동시 비교 시각화 (안정화 버전)</title>
    <!-- 비동기 로딩 지연 방지를 위해 동기식으로 확실히 로드 -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #343a40; text-align: center; font-size: 1.6rem; margin-bottom: 20px; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .panel { padding: 15px; border-radius: 8px; border: 2px solid transparent; transition: all 0.3s ease; }
        
        .panel.poly { background-color: #e9f2ff; border-color: #0d6efd; }
        .panel.exp { background-color: #feefef; border-color: #dc3545; }
        .panel.log { background-color: #eaf6ec; border-color: #198754; }
        
        .panel h2 { font-size: 1.2rem; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; margin-bottom: 15px; }
        
        .input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .input-row label { font-size: 0.95rem; font-weight: bold; }
        .input-row input[type="number"] { width: 70px; padding: 4px; border: 1px solid #ced4da; border-radius: 4px; text-align: right; }
        
        .poly-coeffs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 150px; overflow-y: auto; padding-right: 5px; }
        .poly-coeff-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.7); padding: 4px 8px; border-radius: 4px; }
        
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196F3; }
        .poly input:checked + .slider { background-color: #0d6efd; }
        .exp input:checked + .slider { background-color: #dc3545; }
        .log input:checked + .slider { background-color: #198754; }
        input:checked + .slider:before { transform: translateX(18px); }
        
        #math-display { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 20px; font-size: 1.2rem; overflow-x: auto; min-height: 50px; }
        #graphPlot { width: 100%; height: 600px; }
    </style>
</head>
<body>

<div class="container">
    <h1>다항함수 vs 지수함수 vs 로그함수 점근성 비교 모델</h1>
    
    <div class="dashboard">
        <div class="panel poly">
            <div class="panel-header">
                <h2 style="color: #0d6efd;">다항함수 P(x)</h2>
                <label class="switch"><input type="checkbox" id="polyToggle" checked onchange="updateAll()"><span class="slider"></span></label>
            </div>
            <div class="input-row">
                <label>차수 (N):</label>
                <div>
                    <input type="number" id="polyDegree" min="1" max="10" value="2" step="1">
                    <button onclick="buildPolyInputs()" style="padding: 4px; cursor: pointer;">적용</button>
                </div>
            </div>
            <div id="polyInputsContainer" class="poly-coeffs"></div>
        </div>

        <div class="panel exp">
            <div class="panel-header">
                <h2 style="color: #dc3545;">지수함수 E(x)</h2>
                <label class="switch"><input type="checkbox" id="expToggle" checked onchange="updateAll()"><span class="slider"></span></label>
            </div>
            <div class="input-row"><label>계수 (C):</label><input type="number" id="expC" value="1" step="0.5" oninput="updateAll()"></div>
            <div class="input-row"><label>밑 (a):</label><input type="number" id="expBase" value="2" min="0.1" step="0.1" oninput="updateAll()"></div>
            <div class="input-row"><label>상수 (K):</label><input type="number" id="expK" value="0" step="1" oninput="updateAll()"></div>
        </div>

        <div class="panel log">
            <div class="panel-header">
                <h2 style="color: #198754;">로그함수 L(x)</h2>
                <label class="switch"><input type="checkbox" id="logToggle" onchange="updateAll()"><span class="slider"></span></label>
            </div>
            <div class="input-row"><label>계수 (C):</label><input type="number" id="logC" value="1" step="0.5" oninput="updateAll()"></div>
            <div class="input-row"><label>밑 (a):</label><input type="number" id="logBase" value="2" min="0.1" step="0.1" oninput="updateAll()"></div>
            <div class="input-row"><label>상수 (K):</label><input type="number" id="logK" value="0" step="1" oninput="updateAll()"></div>
        </div>
    </div>

    <div id="math-display">수식을 불러오는 중입니다...</div>
    <div id="graphPlot"></div>
</div>

<script>
    let polyCoeffs = [];

    function buildPolyInputs() {
        let degree = parseInt(document.getElementById('polyDegree').value) || 2;
        if (degree < 1) degree = 1;
        if (degree > 10) degree = 10;
        document.getElementById('polyDegree').value = degree;
        
        const container = document.getElementById('polyInputsContainer');
        container.innerHTML = '';
        polyCoeffs = new Array(degree + 1).fill(0);
        polyCoeffs[degree] = 1;

        for (let i = degree; i >= 0; i--) {
            const div = document.createElement('div');
            div.className = 'poly-coeff-item';
            div.innerHTML = `
                <label>x<sup>${i}</sup></label>
                <input type="number" id="poly_c_${i}" value="${polyCoeffs[i]}" step="0.5" oninput="syncPolyCoeff(${i})">
            `;
            container.appendChild(div);
        }
        updateAll();
    }

    function syncPolyCoeff(index) {
        polyCoeffs[index] = parseFloat(document.getElementById(`poly_c_${index}`).value) || 0;
        updateAll();
    }

    function renderLatex() {
        let tex = '';
        const isPoly = document.getElementById('polyToggle').checked;
        const isExp = document.getElementById('expToggle').checked;
        const isLog = document.getElementById('logToggle').checked;

        if (isPoly) {
            let terms = [];
            for (let i = polyCoeffs.length - 1; i >= 0; i--) {
                let c = polyCoeffs[i];
                if (c === 0) continue;
                let term = '';
                if (c > 0 && terms.length > 0) term += '+ ';
                else if (c < 0) term += '- ';
                let absC = Math.abs(c);
                if (absC !== 1 || i === 0) term += absC;
                if (i > 0) { term += 'x'; if (i > 1) term += '^' + i; }
                terms.push(term);
            }
            const polyStr = terms.length > 0 ? terms.join(' ') : '0';
            tex += `\\color{#0d6efd}{P(x) = ${polyStr}} \\\\ `;
        }

        if (isExp) {
            let c = parseFloat(document.getElementById('expC').value) || 1;
            let a = parseFloat(document.getElementById('expBase').value) || 2;
            let k = parseFloat(document.getElementById('expK').value) || 0;
            let expStr = `${c !== 1 ? c + ' \\cdot ' : ''}${a}^x`;
            if (k > 0) expStr += ` + ${k}`; else if (k < 0) expStr += ` - ${Math.abs(k)}`;
            tex += `\\color{#dc3545}{E(x) = ${expStr}} \\\\ `;
        }

        if (isLog) {
            let c = parseFloat(document.getElementById('logC').value) || 1;
            let a = parseFloat(document.getElementById('logBase').value) || 2;
            let k = parseFloat(document.getElementById('logK').value) || 0;
            let logStr = `${c !== 1 ? c + ' \\cdot ' : ''}\\log_{${a}}(x)`;
            if (k > 0) logStr += ` + ${k}`; else if (k < 0) logStr += ` - ${Math.abs(k)}`;
            tex += `\\color{#198754}{L(x) = ${logStr}}`;
        }

        if (tex === '') tex = '\\text{활성화된 함수가 없습니다.}';
        
        const display = document.getElementById('math-display');
        display.innerHTML = `$$ \\begin{align*} ${tex} \\end{align*} $$`;
        
        // [중요 수정] MathJax 로드 상태를 검증하는 예외 처리 방어 로직 추가
        if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
            MathJax.typesetPromise([display]).catch(function (err) {
                console.warn('MathJax 렌더링 지연:', err.message);
            });
        }
    }

    function generateTraces(rangeX) {
        const spanX = rangeX[1] - rangeX[0];
        const minX = rangeX[0] - spanX;
        const maxX = rangeX[1] + spanX;
        const step = Math.max((maxX - minX) / 2000, 0.001);
        const traces = [];

        if (document.getElementById('polyToggle').checked) {
            const xVal = [], yVal = [];
            for (let x = minX; x <= maxX; x += step) {
                xVal.push(x);
                let y = 0;
                for (let i = 0; i < polyCoeffs.length; i++) y += polyCoeffs[i] * Math.pow(x, i);
                yVal.push(y);
            }
            traces.push({ x: xVal, y: yVal, mode: 'lines', name: 'P(x) 다항함수', line: { color: '#0d6efd', width: 3 } });
        }

        if (document.getElementById('expToggle').checked) {
            const xVal = [], yVal = [];
            let c = parseFloat(document.getElementById('expC').value) || 1;
            let a = Math.max(parseFloat(document.getElementById('expBase').value) || 2, 0.001);
            if (a === 1) a = 1.0001;
            let k = parseFloat(document.getElementById('expK').value) || 0;
            for (let x = minX; x <= maxX; x += step) {
                xVal.push(x); yVal.push(c * Math.pow(a, x) + k);
            }
            traces.push({ x: xVal, y: yVal, mode: 'lines', name: 'E(x) 지수함수', line: { color: '#dc3545', width: 3 } });
        }

        if (document.getElementById('logToggle').checked) {
            const xVal = [], yVal = [];
            let c = parseFloat(document.getElementById('logC').value) || 1;
            let a = Math.max(parseFloat(document.getElementById('logBase').value) || 2, 0.001);
            if (a === 1) a = 1.0001;
            let k = parseFloat(document.getElementById('logK').value) || 0;
            const logMin = Math.max(0.00001, minX);
            for (let x = logMin; x <= maxX; x += step) {
                xVal.push(x); yVal.push(c * (Math.log(x) / Math.log(a)) + k);
            }
            traces.push({ x: xVal, y: yVal, mode: 'lines', name: 'L(x) 로그함수', line: { color: '#198754', width: 3 } });
        }

        if (traces.length === 0) traces.push({ x: [], y: [], name: '활성화 없음' });
        return traces;
    }

    function getDynamicTick(range) {
        if (!range || range.length < 2) return 0.5;
        return Math.abs(range[1] - range[0]) <= 20 ? 0.5 : undefined; 
    }

    function updateAll() {
        renderLatex();
        const graphDiv = document.getElementById('graphPlot');
        if (!graphDiv || !graphDiv.layout) return;

        const currentXRange = graphDiv.layout.xaxis.range;
        const newTraces = generateTraces(currentXRange);
        
        // [중요 수정] Plotly 로드 상태 검증 로직 추가
        if (typeof Plotly !== 'undefined') {
            Plotly.react('graphPlot', newTraces, graphDiv.layout);
            Plotly.relayout('graphPlot', {
                'xaxis.dtick': getDynamicTick(currentXRange),
                'yaxis.dtick': getDynamicTick(graphDiv.layout.yaxis.range)
            });
        }
    }

    function initGraph() {
        // Plotly 라이브러리가 로드되지 않았다면 0.1초 후 재시도 (재귀적 Polling)
        if (typeof Plotly === 'undefined') {
            setTimeout(initGraph, 100);
            return;
        }

        const layout = {
            dragmode: 'pan',
            xaxis: { range: [-5, 5], dtick: 0.5, zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2, gridcolor: '#e9ecef', title: 'x 축' },
            yaxis: { range: [-5, 5], dtick: 0.5, zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2, gridcolor: '#e9ecef', title: 'y 축' },
            margin: { l: 60, r: 40, t: 20, b: 60 }, hovermode: 'closest'
        };

        Plotly.newPlot('graphPlot', [], layout, {
            responsive: true, scrollZoom: true, displayModeBar: true, modeBarButtonsToRemove: ['lasso2d', 'select2d']
        });

        document.getElementById('graphPlot').on('plotly_relayout', function(eventData) {
            if (eventData['xaxis.dtick'] || eventData['yaxis.dtick']) return;
            updateAll();
        });

        buildPolyInputs();
    }

    window.onload = initGraph;
</script>
</body>
</html>
