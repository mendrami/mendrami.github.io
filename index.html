<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>범용 수학 함수 시각화</title>
    <!-- 시각화를 위한 Plotly 라이브러리 -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- 수식 렌더링을 위한 MathJax 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .control-panel { background: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .func-selector { margin-bottom: 20px; text-align: center; }
        select { padding: 8px; font-size: 1.1rem; border-radius: 5px; border: 1px solid #ced4da; }
        .input-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        input[type="number"] { padding: 6px; width: 80px; border-radius: 4px; border: 1px solid #ced4da; text-align: right; }
        button { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; background-color: #0d6efd; color: white; font-weight: bold; }
        button:hover { background-color: #0b5ed7; }
        #math-display { text-align: center; font-size: 1.5rem; margin: 20px 0; min-height: 40px; color: #000; overflow-x: auto; }
        h1 { color: #343a40; text-align: center; font-size: 1.5rem; }
        .poly-coeff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; }
        .poly-item { background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #dee2e6; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>연속 함수 및 점근적 거동 시각화 모델</h1>
    
    <div class="control-panel">
        <div class="func-selector">
            <label for="funcType"><strong>함수 유형 선택 : </strong></label>
            <select id="funcType" onchange="switchFunctionType()">
                <option value="poly">N차 다항함수 (Polynomial)</option>
                <option value="exp">지수함수 (Exponential)</option>
                <option value="log">로그함수 (Logarithmic)</option>
            </select>
        </div>

        <!-- N차 다항함수 컨트롤 -->
        <div id="polyControls">
            <div class="input-group">
                <label>차수 (N) : </label>
                <input type="number" id="polyDegree" min="1" max="10" value="2" step="1">
                <button onclick="generatePolyInputs()">계수 입력란 생성</button>
            </div>
            <div id="polyInputsContainer" class="poly-coeff-grid"></div>
        </div>

        <!-- 지수함수 컨트롤 -->
        <div id="expControls" style="display: none;">
            <div class="input-group">
                <label>계수 (C) : </label><input type="number" id="expC" value="1" step="0.5" oninput="updatePlot()">
                <label>밑 (a) : </label><input type="number" id="expBase" value="2" min="0.1" step="0.1" oninput="updatePlot()">
                <label>상수 (K) : </label><input type="number" id="expK" value="0" step="1" oninput="updatePlot()">
            </div>
            <p style="text-align:center; font-size: 0.85rem; color:#6c757d;">(조건: 밑 a > 0, a ≠ 1)</p>
        </div>

        <!-- 로그함수 컨트롤 -->
        <div id="logControls" style="display: none;">
            <div class="input-group">
                <label>계수 (C) : </label><input type="number" id="logC" value="1" step="0.5" oninput="updatePlot()">
                <label>밑 (a) : </label><input type="number" id="logBase" value="2" min="0.1" step="0.1" oninput="updatePlot()">
                <label>상수 (K) : </label><input type="number" id="logK" value="0" step="1" oninput="updatePlot()">
            </div>
            <p style="text-align:center; font-size: 0.85rem; color:#6c757d;">(조건: 밑 a > 0, a ≠ 1 / 정의역 x > 0)</p>
        </div>
    </div>

    <!-- 수학 공식 렌더링 영역 -->
    <div id="math-display">$$f(x) = x^2$$</div>

    <!-- 그래프 렌더링 영역 -->
    <div id="graphPlot"></div>
</div>

<script>
    let currentMode = 'poly';
    let polyCoeffs = []; // [a_0, a_1, a_2, ..., a_N] (인덱스가 차수)

    function switchFunctionType() {
        currentMode = document.getElementById('funcType').value;
        document.getElementById('polyControls').style.display = currentMode === 'poly' ? 'block' : 'none';
        document.getElementById('expControls').style.display = currentMode === 'exp' ? 'block' : 'none';
        document.getElementById('logControls').style.display = currentMode === 'log' ? 'block' : 'none';
        
        if(currentMode === 'poly' && polyCoeffs.length === 0) {
            generatePolyInputs();
        } else {
            updatePlot();
        }
    }

    // N차 다항함수 계수 입력란 동적 생성
    function generatePolyInputs() {
        let degree = parseInt(document.getElementById('polyDegree').value);
        if (degree < 1) degree = 1;
        if (degree > 10) { degree = 10; document.getElementById('polyDegree').value = 10; } // 클라이언트 메모리 부하 방지용 상한
        
        const container = document.getElementById('polyInputsContainer');
        container.innerHTML = '';
        polyCoeffs = new Array(degree + 1).fill(0);
        
        // 기본값: 최고차항 1, 나머지 0
        polyCoeffs[degree] = 1;

        for (let i = degree; i >= 0; i--) {
            const div = document.createElement('div');
            div.className = 'poly-item';
            div.innerHTML = `
                <label>x<sup>${i}</sup> 계수</label><br>
                <input type="number" id="poly_c_${i}" value="${polyCoeffs[i]}" step="0.5" oninput="syncPolyCoeffs(${i})">
            `;
            container.appendChild(div);
        }
        updatePlot();
    }

    // 배열 동기화 및 그래프 업데이트
    function syncPolyCoeffs(index) {
        polyCoeffs[index] = parseFloat(document.getElementById(`poly_c_${index}`).value) || 0;
        updatePlot();
    }

    // LaTeX 수식 문자열 생성기
    function generateLatex() {
        let latex = 'f(x) = ';
        if (currentMode === 'poly') {
            let terms = [];
            for (let i = polyCoeffs.length - 1; i >= 0; i--) {
                let c = polyCoeffs[i];
                if (c === 0) continue;
                
                let term = '';
                if (c > 0 && terms.length > 0) term += '+ ';
                else if (c < 0) term += '- ';
                
                let absC = Math.abs(c);
                if (absC !== 1 || i === 0) term += absC;
                
                if (i > 0) {
                    term += 'x';
                    if (i > 1) term += '^' + i;
                }
                terms.push(term);
            }
            latex += terms.length > 0 ? terms.join(' ') : '0';
        } else if (currentMode === 'exp') {
            let c = parseFloat(document.getElementById('expC').value) || 1;
            let a = parseFloat(document.getElementById('expBase').value) || 2;
            let k = parseFloat(document.getElementById('expK').value) || 0;
            
            latex += `${c !== 1 ? c + ' \\cdot ' : ''}${a}^x`;
            if (k > 0) latex += ` + ${k}`;
            else if (k < 0) latex += ` - ${Math.abs(k)}`;
        } else if (currentMode === 'log') {
            let c = parseFloat(document.getElementById('logC').value) || 1;
            let a = parseFloat(document.getElementById('logBase').value) || 2;
            let k = parseFloat(document.getElementById('logK').value) || 0;
            
            latex += `${c !== 1 ? c + ' \\cdot ' : ''}\\log_{${a}}(x)`;
            if (k > 0) latex += ` + ${k}`;
            else if (k < 0) latex += ` - ${Math.abs(k)}`;
        }
        return `$$ ${latex} $$`;
    }

    // 수학적 정의역 기반 데이터 생성 엔진
    function calculateData(rangeX) {
        const xValues = [], yValues = [];
        const spanX = rangeX[1] - rangeX[0];
        const minX = rangeX[0] - spanX; // 여유 도메인
        const maxX = rangeX[1] + spanX;
        const step = Math.max((maxX - minX) / 2000, 0.001); // 해상도 최적화

        if (currentMode === 'poly') {
            for (let x = minX; x <= maxX; x += step) {
                xValues.push(x);
                let y = 0;
                for (let i = 0; i < polyCoeffs.length; i++) {
                    y += polyCoeffs[i] * Math.pow(x, i);
                }
                yValues.push(y);
            }
        } else if (currentMode === 'exp') {
            let c = parseFloat(document.getElementById('expC').value) || 1;
            let a = Math.max(parseFloat(document.getElementById('expBase').value) || 2, 0.001); // 음수 방어
            if (a === 1) a = 1.0001; // 특이점 방어
            let k = parseFloat(document.getElementById('expK').value) || 0;

            for (let x = minX; x <= maxX; x += step) {
                xValues.push(x);
                yValues.push(c * Math.pow(a, x) + k);
            }
        } else if (currentMode === 'log') {
            let c = parseFloat(document.getElementById('logC').value) || 1;
            let a = Math.max(parseFloat(document.getElementById('logBase').value) || 2, 0.001);
            if (a === 1) a = 1.0001;
            let k = parseFloat(document.getElementById('logK').value) || 0;

            // 정의역 제한: x > 0 (해석적 연속성을 위해 0.00001 부터 시작)
            const logMin = Math.max(0.00001, minX);
            for (let x = logMin; x <= maxX; x += step) {
                xValues.push(x);
                yValues.push(c * (Math.log(x) / Math.log(a)) + k); // 밑변환 공식
            }
        }
        return { x: xValues, y: yValues };
    }

    function getDynamicTick(range) {
        if (!range || range.length < 2) return 0.5;
        const span = Math.abs(range[1] - range[0]);
        // 범위가 20 이하일 경우 수리적 관찰을 위해 0.5 간격 고정
        return span <= 20 ? 0.5 : undefined; 
    }

    function updatePlot() {
        // 수식 렌더링 업데이트
        document.getElementById('math-display').innerHTML = generateLatex();
        MathJax.typesetPromise();

        const graphDiv = document.getElementById('graphPlot');
        if (!graphDiv.layout) return;

        const currentXRange = graphDiv.layout.xaxis.range;
        const currentYRange = graphDiv.layout.yaxis.range;
        
        const data = calculateData(currentXRange);

        // 눈금 동기화
        const updateLayout = {
            'xaxis.dtick': getDynamicTick(currentXRange),
            'yaxis.dtick': getDynamicTick(currentYRange)
        };

        Plotly.restyle('graphPlot', { x: [data.x], y: [data.y] });
        Plotly.relayout('graphPlot', updateLayout);
    }

    function initGraph() {
        const initialRangeX = [-5, 5];
        const initialRangeY = [-5, 5];

        const layout = {
            dragmode: 'pan',
            xaxis: { 
                range: initialRangeX, dtick: 0.5, 
                zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2, gridcolor: '#e9ecef', title: 'x 축'
            },
            yaxis: { 
                range: initialRangeY, dtick: 0.5, 
                zeroline: true, zerolinecolor: '#343a40', zerolinewidth: 2, gridcolor: '#e9ecef', title: 'y 축'
            },
            width: 900, height: 600,
            margin: { l: 60, r: 40, t: 20, b: 60 },
            hovermode: 'closest'
        };

        // 초기 빈 트레이스로 생성 후 updatePlot이 덮어씀
        Plotly.newPlot('graphPlot', [{ x: [], y: [], mode: 'lines', line: { color: '#0d6efd', width: 3 } }], layout, {
            responsive: true, scrollZoom: true, displayModeBar: true, modeBarButtonsToRemove: ['lasso2d', 'select2d']
        });

        // 스크롤 줌 및 팬 이동 시 데이터 동적 재연산 (끊김 방지)
        document.getElementById('graphPlot').on('plotly_relayout', function(eventData) {
            updatePlot();
        });

        generatePolyInputs(); // 초기 함수 세팅
    }

    // 문서 로드 완료 후 초기화
    window.onload = initGraph;

</script>
</body>
</html>
